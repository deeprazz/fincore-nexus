services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    image: postgres:17
    container_name: fincore-postgres
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Provision dedicated databases for microservice boundary isolation
  db-init:
    image: postgres:17
    container_name: fincore-db-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      bash -c "
      psql -h postgres -U fincore -d fincore -tc \"SELECT 1 FROM pg_database WHERE datname = 'fincore_loan'\" | grep -q 1 || psql -h postgres -U fincore -d fincore -c 'CREATE DATABASE fincore_loan';
      psql -h postgres -U fincore -d fincore -tc \"SELECT 1 FROM pg_database WHERE datname = 'fincore_payment'\" | grep -q 1 || psql -h postgres -U fincore -d fincore -c 'CREATE DATABASE fincore_payment';
      psql -h postgres -U fincore -d fincore -tc \"SELECT 1 FROM pg_database WHERE datname = 'fincore_kyc'\" | grep -q 1 || psql -h postgres -U fincore -d fincore -c 'CREATE DATABASE fincore_kyc';
      psql -h postgres -U fincore -d fincore -tc \"SELECT 1 FROM pg_database WHERE datname = 'fincore_notification'\" | grep -q 1 || psql -h postgres -U fincore -d fincore -c 'CREATE DATABASE fincore_notification';
      echo 'All FinCore microservice databases provisioned successfully.';
      "
    environment:
      PGPASSWORD: fincore_dev

  redis:
    image: redis:7-alpine
    container_name: fincore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: fincore-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fincore-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_change_me}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8089:8080"
    volumes:
      - ./infra/keycloak/fincore-realm.json:/opt/keycloak/data/import/fincore-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # Application Microservices
  # ============================================================================
  core-banking:
    build:
      context: ./services/core-banking-services
      dockerfile: Dockerfile
    container_name: fincore-core-banking
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FINCORE_SECURITY_TELLER_PASSWORD: Teller@123
      FINCORE_SECURITY_MANAGER_PASSWORD: Manager@123
      FINCORE_SECURITY_ADMIN_PASSWORD: Admin@123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  loan-service:
    build:
      context: ./services/loan-service
      dockerfile: Dockerfile
    container_name: fincore-loan-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore_loan
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORE_BANKING_URL: http://core-banking:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: fincore-payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore_payment
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_CORE_BANKING_URL: http://core-banking:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  kyc-service:
    build:
      context: ./services/kyc-service
      dockerfile: Dockerfile
    container_name: fincore-kyc-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore_kyc
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KYC_CORE_BANKING_URL: http://core-banking:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: fincore-notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fincore_notification
      SPRING_DATASOURCE_USERNAME: fincore
      SPRING_DATASOURCE_PASSWORD: fincore_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: fincore-api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORE_BANKING_URL: http://core-banking:8081
      LOAN_SERVICE_URL: http://loan-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      KYC_SERVICE_URL: http://kyc-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      redis:
        condition: service_healthy
      core-banking:
        condition: service_started
      loan-service:
        condition: service_started
      payment-service:
        condition: service_started
      kyc-service:
        condition: service_started
      notification-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fincore-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
  kafka-data:
