server:
  port: 8081

spring:
  application:
    name: core-banking-services
  datasource:
    url: jdbc:postgresql://localhost:5432/fincore
    username: fincore
    password: fincore_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: core-banking-loan-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fincore.*"
        spring.json.type.mapping: "com.fincore.loan_service.event.LoanApprovedEvent:com.fincore.core_banking_services.events.LoanApprovedCommand,com.fincore.loan_service.event.EmiDebitRequestedEvent:com.fincore.core_banking_services.events.EmiDebitCommand"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

fincore:
  security:
    teller-password: ${FINCORE_TELLER_PASSWORD:Teller@123}
    manager-password: ${FINCORE_MANAGER_PASSWORD:Manager@123}
    admin-password: ${FINCORE_ADMIN_PASSWORD:Admin@123}
