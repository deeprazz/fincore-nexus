server:
  port: 0

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379

gateway:
  routes:
    core: http://localhost:8081
    loan: http://localhost:8082
    payment: http://localhost:8083
    kyc: http://localhost:8084
    notification: http://localhost:8085
  rate-limit:
    enabled: false
    requests-per-minute: 120
