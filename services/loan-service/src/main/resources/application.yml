server:
  port: 8082
spring:
  application:
    name: loan-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fincore_loan
    username: fincore
    password: fincore_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: loan-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "java.util.Map"
        spring.json.type.mapping: "com.fincore.core_banking_services.events.LoanDisbursedResponse:com.fincore.loan_service.event.LoanDisbursedEvent,com.fincore.core_banking_services.events.EmiDebitResultResponse:com.fincore.loan_service.event.EmiDebitResultEvent"
fincore:
  security:
    teller-password: ${FINCORE_TELLER_PASSWORD:Teller@123}
    manager-password: ${FINCORE_MANAGER_PASSWORD:Manager@123}
    admin-password: ${FINCORE_ADMIN_PASSWORD:Admin@123}
  core-banking:
    base-url: ${CORE_BANKING_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.fincore: DEBUG
