apiVersion: v1
kind: Secret
metadata:
  name: fincore-secrets
  namespace: fincore-nexus
type: Opaque
stringData:
  POSTGRES_USER: "fincore"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_POSTGRES_PASSWORD"
  FINCORE_TELLER_PASSWORD: "REPLACE_WITH_SECURE_TELLER_PASSWORD"
  FINCORE_MANAGER_PASSWORD: "REPLACE_WITH_SECURE_MANAGER_PASSWORD"
  FINCORE_ADMIN_PASSWORD: "REPLACE_WITH_SECURE_ADMIN_PASSWORD"
  KYC_SECRET_KEY: "REPLACE_WITH_32_BYTE_HEX_OR_BASE64_AES_KEY"
