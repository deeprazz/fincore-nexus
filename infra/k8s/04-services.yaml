apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fincore-nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: fincore/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CORE_BANKING_URL
              value: "http://core-banking:8081"
            - name: LOAN_SERVICE_URL
              value: "http://loan-service:8082"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8083"
            - name: KYC_SERVICE_URL
              value: "http://kyc-service:8084"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8085"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fincore-nexus
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fincore-nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fincore/frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fincore-nexus
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fincore-ingress
  namespace: fincore-nexus
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: fincore.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
