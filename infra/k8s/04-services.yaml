apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-banking
  namespace: fincore-nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-banking
  template:
    metadata:
      labels:
        app: core-banking
    spec:
      containers:
        - name: core-banking
          image: fincore/core-banking:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: fincore-config
            - secretRef:
                name: fincore-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/fincore"
---
apiVersion: v1
kind: Service
metadata:
  name: core-banking
  namespace: fincore-nexus
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: core-banking
---
