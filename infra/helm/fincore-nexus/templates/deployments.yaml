apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincore.fullname" . }}-gateway
  labels:
    app: {{ include "fincore.name" . }}-gateway
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: {{ include "fincore.name" . }}-gateway
  template:
    metadata:
      labels:
        app: {{ include "fincore.name" . }}-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fincore.fullname" . }}-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: {{ include "fincore.name" . }}-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fincore.fullname" . }}-frontend
  labels:
    app: {{ include "fincore.name" . }}-frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app: {{ include "fincore.name" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "fincore.name" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}/frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fincore.fullname" . }}-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: {{ include "fincore.name" . }}-frontend
